services:
  - type: web
    name: rumion-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: EXTERNAL_NOVEL_API
        value: https://novel-api.nabaikabaiaguo.workers.dev
      - key: CLIENT_URL
        sync: false   # your Vercel URL, e.g. https://rumion.vercel.app (comma-separate several)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
